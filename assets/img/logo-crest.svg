<svg viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e6b4"/>
      <stop offset="28%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff6dc"/>
      <stop offset="72%" stop-color="#c9962c"/>
      <stop offset="100%" stop-color="#f6e6b4"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9cf8c"/>
      <stop offset="50%" stop-color="#c9962c"/>
      <stop offset="100%" stop-color="#e9cf8c"/>
    </linearGradient>
    <path id="leaf" d="M 0,-9.5 C 5.2,-6 5.2,6 0,9.5 C -5.2,6 -5.2,-6 0,-9.5 Z"/>

    <path id="shieldPath" d="M 160,46
      C 190,46 220,56 248,66
      L 248,168
      C 248,224 210,266 160,296
      C 110,266 72,224 72,168
      L 72,66
      C 100,56 130,46 160,46 Z"/>
    <clipPath id="shieldClip"><use href="#shieldPath"/></clipPath>
  </defs>

  <!-- ================= background card ================= -->
  <rect x="0" y="0" width="320" height="380" rx="28" fill="#ffffff"/>

  <!-- ================= laurel wreath ================= -->
  <g fill="url(#gold)" opacity="0.97">
    <!-- stems -->
    <path d="M 151,323 C 110,318 68,283 65,228 C 63,190 80,160 127,140" fill="none" stroke="url(#goldSoft)" stroke-width="2.5"/>
    <path d="M 169,323 C 210,318 252,283 255,228 C 257,190 240,160 193,140" fill="none" stroke="url(#goldSoft)" stroke-width="2.5"/>

    <!-- left branch leaves -->
    <use href="#leaf" transform="translate(151.7,324.6) rotate(185) scale(1.42)"/>
    <use href="#leaf" transform="translate(124.1,317.9) rotate(202) scale(1.34)"/>
    <use href="#leaf" transform="translate(99.6,303.4) rotate(219) scale(1.27)"/>
    <use href="#leaf" transform="translate(80.6,282.2) rotate(237) scale(1.19)"/>
    <use href="#leaf" transform="translate(68.7,256.4) rotate(254) scale(1.12)"/>
    <use href="#leaf" transform="translate(65.0,228.2) rotate(271) scale(1.05)"/>
    <use href="#leaf" transform="translate(69.8,200.1) rotate(288) scale(0.98)"/>
    <use href="#leaf" transform="translate(82.7,174.8) rotate(306) scale(0.90)"/>
    <use href="#leaf" transform="translate(102.5,154.4) rotate(323) scale(0.83)"/>
    <use href="#leaf" transform="translate(127.5,140.7) rotate(340) scale(0.75)"/>

    <!-- right branch leaves (mirrored) -->
    <use href="#leaf" transform="translate(168.3,324.6) rotate(-5) scale(1.42)"/>
    <use href="#leaf" transform="translate(195.9,317.9) rotate(-22) scale(1.34)"/>
    <use href="#leaf" transform="translate(220.4,303.4) rotate(-39) scale(1.27)"/>
    <use href="#leaf" transform="translate(239.4,282.2) rotate(-57) scale(1.19)"/>
    <use href="#leaf" transform="translate(251.3,256.4) rotate(-74) scale(1.12)"/>
    <use href="#leaf" transform="translate(255.0,228.2) rotate(-91) scale(1.05)"/>
    <use href="#leaf" transform="translate(250.2,200.1) rotate(-108) scale(0.98)"/>
    <use href="#leaf" transform="translate(237.3,174.8) rotate(-126) scale(0.90)"/>
    <use href="#leaf" transform="translate(217.5,154.4) rotate(-143) scale(0.83)"/>
    <use href="#leaf" transform="translate(192.5,140.7) rotate(-160) scale(0.75)"/>
  </g>

  <!-- ================= star ================= -->
  <g transform="translate(160,22)">
    <path fill="url(#gold)" d="M 0,-16 L 4.5,-5.5 16,-4.5 7.2,3 9.8,15 0,8.5 -9.8,15 -7.2,3 -16,-4.5 -4.5,-5.5 Z"/>
  </g>

  <!-- ================= shield ================= -->
  <use href="#shieldPath" fill="#0b1030" stroke="url(#gold)" stroke-width="5"/>

  <g clip-path="url(#shieldClip)">
    <rect x="60" y="40" width="200" height="260" fill="#0b1030"/>
    <polygon points="60,40 210,40 60,230" fill="#7a1128"/>
    <polygon points="195,40 225,40 60,255 60,222" fill="url(#gold)"/>
  </g>
  <use href="#shieldPath" fill="none" stroke="url(#gold)" stroke-width="5"/>

  <!-- crossed rackets + ball on the shield -->
  <g clip-path="url(#shieldClip)">
    <defs>
      <clipPath id="rHeadA"><ellipse cx="0" cy="0" rx="19" ry="27"/></clipPath>
      <clipPath id="rHeadB"><ellipse cx="0" cy="0" rx="19" ry="27"/></clipPath>
    </defs>
    <g transform="translate(160,172) rotate(-30)">
      <ellipse cx="0" cy="-30" rx="19" ry="27" fill="none" stroke="url(#gold)" stroke-width="4"/>
      <g stroke="url(#gold)" stroke-width="1" opacity="0.9" clip-path="url(#rHeadA)" transform="translate(0,-30)">
        <line x1="-19" y1="0" x2="19" y2="0"/>
        <line x1="-17" y1="-10" x2="17" y2="-10"/>
        <line x1="-17" y1="10" x2="17" y2="10"/>
        <line x1="-17" y1="19" x2="17" y2="19"/>
        <line x1="-12" y1="-24" x2="-12" y2="24"/>
        <line x1="-4" y1="-26" x2="-4" y2="26"/>
        <line x1="4" y1="-26" x2="4" y2="26"/>
        <line x1="12" y1="-24" x2="12" y2="24"/>
      </g>
      <path d="M -5.5,0 L -3.5,32 L 3.5,32 L 5.5,0 Z" fill="url(#gold)"/>
      <rect x="-4.5" y="32" width="9" height="20" rx="3" fill="url(#gold)"/>
    </g>
    <g transform="translate(160,172) rotate(30) scale(-1,1)">
      <ellipse cx="0" cy="-30" rx="19" ry="27" fill="none" stroke="#f3ecd6" stroke-width="4"/>
      <g stroke="#f3ecd6" stroke-width="1" opacity="0.9" clip-path="url(#rHeadB)" transform="translate(0,-30)">
        <line x1="-19" y1="0" x2="19" y2="0"/>
        <line x1="-17" y1="-10" x2="17" y2="-10"/>
        <line x1="-17" y1="10" x2="17" y2="10"/>
        <line x1="-17" y1="19" x2="17" y2="19"/>
        <line x1="-12" y1="-24" x2="-12" y2="24"/>
        <line x1="-4" y1="-26" x2="-4" y2="26"/>
        <line x1="4" y1="-26" x2="4" y2="26"/>
        <line x1="12" y1="-24" x2="12" y2="24"/>
      </g>
      <path d="M -5.5,0 L -3.5,32 L 3.5,32 L 5.5,0 Z" fill="#f3ecd6"/>
      <rect x="-4.5" y="32" width="9" height="20" rx="3" fill="#f3ecd6"/>
    </g>
    <circle cx="160" cy="174" r="10.5" fill="#101012" stroke="url(#gold)" stroke-width="1.6"/>
    <circle cx="163.4" cy="169.6" r="1.7" fill="#f3d21e"/>
    <circle cx="163.4" cy="176.4" r="1.7" fill="#f3d21e"/>
    <circle cx="155.5" cy="179" r="1.1" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- ================= ribbon banner ================= -->
  <g>
    <rect x="46" y="288" width="228" height="50" rx="12" fill="url(#gold)" stroke="#8a6a1e" stroke-width="1.5"/>
    <text x="160" y="314" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" letter-spacing="0.3" fill="#0b1030">CHEAM SQUASH</text>
  </g>
</svg>
